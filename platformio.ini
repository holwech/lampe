[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
; Keep the existing bootloader target until the fitted Pro Mini is verified.
platform = atmelavr@5.3.0
framework = arduino
board = nanoatmega328
platform_packages =
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/framework-arduino-avr@5.4.0
lib_deps =
    fastled/FastLED@3.10.5
monitor_speed = 115200
; Follow application includes without scanning every optional FastLED module.
lib_ldf_mode = chain

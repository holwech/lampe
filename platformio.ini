[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
; Keep the existing bootloader target until the fitted Pro Mini is verified.
platform = atmelavr@5.1.0
framework = arduino
board = nanoatmega328
platform_packages =
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/framework-arduino-avr@5.2.0
monitor_speed = 115200
; Follow implementation-file dependencies between Lampe and the effect registry.
lib_ldf_mode = deep+
; FastLED 3.1.8 remains vendored in lib/ to preserve the working baseline.

[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
; Keep the existing bootloader target until the fitted Pro Mini is verified.
platform = atmelavr@5.3.0
framework = arduino
board = nanoatmega328
platform_packages =
    platformio/toolchain-atmelavr@3.70300.220127
    platformio/framework-arduino-avr@5.4.0
    platformio/tool-avrdude@1.80100.0
lib_deps =
    fastled/FastLED@3.10.5
monitor_speed = 115200
; Follow application includes without scanning every optional FastLED module.
lib_ldf_mode = chain

; Hardware timing verification: synthetic microphone input, actual 120 Hz LEDs.
; Never use this environment for normal lamp operation.
[env:nanoatmega328_timing]
extends = env:nanoatmega328
build_flags = -DLAMP_TIMING_DIAGNOSTICS -DLAMP_TIMING_STRESS

; Microphone feedback check: real audio/tracking with constant LED output.
; Restore nanoatmega328 after recording the comparison.
[env:nanoatmega328_mic_check]
extends = env:nanoatmega328
build_flags = -DLAMP_MICROPHONE_STEADY_LEDS

; Production-loop ADC audit with steady / predetermined flashing LEDs.
; Diagnostic only: restore nanoatmega328 after the paired recording.
[env:nanoatmega328_sampling_steady]
extends = env:nanoatmega328
build_flags = -DLAMP_TIMING_DIAGNOSTICS -DLAMP_SAMPLING_DIAGNOSTICS

[env:nanoatmega328_sampling_pulsed]
extends = env:nanoatmega328_sampling_steady
build_flags = ${env:nanoatmega328_sampling_steady.build_flags} -DLAMP_SAMPLING_PULSED

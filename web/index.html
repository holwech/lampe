<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edece7" />
    <title>Lampe Studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23222b26'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23c7ef8c' stroke-width='4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <svg
      class="icon-definitions"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
    >
      <symbol id="icon-power" viewBox="0 0 24 24">
        <path d="M12 2v10M7 5a8 8 0 1 0 10 0" />
      </symbol>
    </svg>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Lampe Studio home"
          >lampe <span class="brand-studio">studio</span></a
        >
        <div class="mode-switch" role="group" aria-label="Source">
          <button id="sim-mode" aria-pressed="true">Simulator</button>
          <button id="live-mode" aria-pressed="false">Live lamp</button>
        </div>
      </header>
      <main>
        <div id="notice" class="notice" role="status">Loading…</div>
        <div id="live-info" class="live-info" hidden>
          <span
            ><svg class="icon" aria-hidden="true">
              <use href="#icon-power" /></svg
            >FTDI + separate 5 V supply</span
          >
          <button
            id="connect"
            class="primary"
            title="Opening the port may reset the lamp"
          >
            Connect lamp
          </button>
        </div>
        <div class="workspace">
          <section class="viewer-panel" aria-label="3D lamp preview">
            <div class="stage" id="stage">
              <div class="stage-top">
                <span id="source-label" class="source-label" hidden
                  ><i></i><span id="connection-status">Offline</span></span
                >
              </div>
              <canvas
                id="lamp-canvas"
                aria-label="Interactive 3D model of Lampe Mini. Drag to rotate and scroll to zoom."
              ></canvas>
              <div id="stage-message" class="stage-message" hidden></div>
              <div class="stage-tools">
                <button
                  id="diffuser"
                  aria-pressed="true"
                  aria-label="Diffuser on"
                  title="Toggle diffuser"
                >
                  <span class="toggle-track" aria-hidden="true"></span>Diffuser
                </button>
              </div>
            </div>
            <section class="pixels" aria-label="LED inspector">
              <div id="led-strip" class="led-strip"></div>
              <div
                class="pixel-detail"
                title="Raw LED values, before global brightness"
              >
                <span id="pixel-name">Pixel 00</span
                ><code id="pixel-rgb">R 000 G 000 B 000</code
                ><code id="pixel-hex">#000000</code>
              </div>
            </section>
          </section>
          <aside class="controls" aria-label="Lamp controls">
            <section class="programs-section">
              <h2>Programs</h2>
              <div
                id="programs"
                class="programs"
                role="group"
                aria-label="Light programs"
              ></div>
            </section>
            <section id="audio-section" class="audio-section" hidden>
              <div class="section-line">
                <h2>Sound</h2>
                <output
                  aria-live="off"
                  id="audio-value"
                  aria-label="Audio response"
                  >0%</output
                >
              </div>
              <div id="audio-source" class="audio-controls">
                <label for="audio-mode" class="sr-only"
                  >Simulated sound source</label
                >
                <select id="audio-mode" disabled>
                  <option value="pulse">Pulse</option>
                  <option value="steady">Steady</option>
                  <option value="silence">Silence</option>
                </select>
              </div>
              <div
                class="meter"
                role="meter"
                aria-label="Audio envelope"
                aria-valuemin="0"
                aria-valuemax="255"
                aria-valuenow="0"
              >
                <span id="audio-meter"></span>
              </div>
              <div id="audio-input">
                <label class="slider-label" for="audio-level"
                  ><span>Input level</span
                  ><output aria-live="off" id="audio-level-value"
                    >45%</output
                  ></label
                >
                <input
                  id="audio-level"
                  type="range"
                  min="0"
                  max="100"
                  value="45"
                  disabled
                />
              </div>
            </section>
          </aside>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

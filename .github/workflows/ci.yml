name: Lamp checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.11.21'
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Install pinned firmware dependencies
        run: uv run --locked pio pkg install --environment nanoatmega328
      - name: Test firmware logic and effect rendering
        run: uv run --locked python scripts/test.py
      - name: Build AVR firmware
        run: uv run --locked pio run --environment nanoatmega328
      - name: Check uploader with a simulated ATmega328P
        run: >-
          uv run --locked pio pkg exec --package platformio/tool-avrdude --
          avrdude -N -p m328p -c dryrun
          -U flash:w:.pio/build/nanoatmega328/firmware.hex:i
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          uv run --locked python "$RUNNER_TEMP/emsdk/emsdk.py" install "$(cat .emscripten-version)"
          uv run --locked python "$RUNNER_TEMP/emsdk/emsdk.py" activate "$(cat .emscripten-version)"
          echo "EMXX=$RUNNER_TEMP/emsdk/upstream/emscripten/em++" >> "$GITHUB_ENV"
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build shared engine and dashboard
        run: npm run build
      - name: Verify native and WebAssembly parity and serial framing
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test dashboard and simulated serial connection
        run: npm run test:browser
